[package]
name = "table-read-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "C interface to the shared core for the Flutter apps (dart:ffi): JSON in, JSON out"

[package.metadata]
license-tier = "permissive"

[lib]
name = "table_read_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
static-pdfium = ["table-read-core/static-pdfium"]

[dependencies]
table-read-core = { path = "../core" }
table-read-parser = { path = "../parser" }
serde_json = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7763", "thread_safe"] }
